name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        uses: ArtemGr/kivy-buildozer-action@v1
        with:
          workdir: .

      - name: Get APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
